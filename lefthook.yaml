pre-push:
  parallel: true
  commands:
    test:
      glob: "*.dart"
      run: flutter test

pre-commit:
  parallel: true
  commands:
    analyze:
      glob: "*.dart"
      run: flutter analyze --no-fatal-warnings --no-fatal-infos
    format:
      glob: "*.dart"
      run: dart format {staged_files}
