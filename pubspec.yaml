name: fluency
description: "Fluency - AI-powered language learning application."
publish_to: "none"
version: 1.3.1+34

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0 <4.0.0"

dependencies:
  archive: ^4.0.0
  audioplayers: ^6.0.0
  csv: ^6.0.0
  file_picker: ^10.3.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10
  flutter_tts: ^4.2.0
  get_it: ^9.2.0
  go_router: ^17.0.0
  http: ^1.6.0
  intl: ^0.20.2
  logging: ^1.3.0
  package_info_plus: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.0
  provider: ^6.1.5+1
  share_plus: ^7.2.0
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  dio: ^5.7.0
  universal_io: ^2.3.1
  url_launcher: ^6.2.0
  permission_handler: ^12.0.1
  sherpa_onnx: ^1.12.23
  crypto: ^3.0.7
  html: ^0.15.6
  uuid: ^4.5.1
  smooth_gradient: ^0.1.0

dev_dependencies:
  build_runner: ^2.5.4
  flutter_lints: ^2.0.3
  flutter_test:
    sdk: flutter
  spider: ^4.2.2
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.png
    - .env.dev
    - .env.prod
    - assets/themes/
    - assets/icons/
    - assets/fonts/
    - assets/images/voice_avatars/
    - assets/courses/
    - "assets/courses/Master Vocabulary by Topics Part 1/"
    - "assets/courses/Master Vocabulary by Topics Part 1/audio/"
    - "assets/courses/Master Vocabulary by Topics Part 1/image/"
    - "assets/courses/Pronunciation Master: Speak with Confidence/"
    - "assets/courses/Pronunciation Master: Speak with Confidence/image/"
    - lib/core/mock/
    # - lib/core/mock/Cambridge_IELTS_18/
    # - lib/core/mock/Cambridge_IELTS_18/audio/
    # - lib/core/mock/Cambridge_IELTS_18/passage/
    # - lib/core/mock/Cambridge_IELTS_18/image/
    - lib/core/mock/Temp/
    - lib/core/mock/Temp/audio/
    - assets/voices/
    - assets/sound-effect/

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DM_Sans/static/DMSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/DM_Sans/static/DMSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/DM_Sans/static/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DM_Sans/static/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DM_Sans/static/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DM_Sans/static/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DM_Sans/static/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DM_Sans/static/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DM_Sans/static/DMSans-Black.ttf
          weight: 900
        - asset: assets/fonts/DM_Sans/static/DMSans-Italic.ttf
          style: italic
        - asset: assets/fonts/DM_Sans/static/DMSans-BoldItalic.ttf
          weight: 700
          style: italic
