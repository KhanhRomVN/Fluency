name: fluency
description: "A new Flutter project."
publish_to: "none"
version: 1.2.18+28

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0 <4.0.0"

dependencies:
  archive: ^4.0.0
  audioplayers: ^6.0.0
  csv: ^6.0.0
  file_picker: ^10.3.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10
  flutter_tts: ^4.2.0
  get_it: ^9.2.0
  go_router: ^17.0.0
  http: ^1.6.0
  intl: ^0.20.2
  logging: ^1.3.0
  package_info_plus: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.0
  provider: ^6.1.5+1
  share_plus: ^7.2.0
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  dio: ^5.7.0
  universal_io: ^2.3.1
  url_launcher: ^6.2.0
  permission_handler: ^12.0.1
  vosk_flutter_service: ^0.0.6
  sherpa_onnx: ^1.12.23
  crypto: ^3.0.7
  html: ^0.15.6
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.5.4
  flutter_lints: ^2.0.3
  flutter_test:
    sdk: flutter
  spider: ^4.2.2
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.dev
    - .env.prod
    - assets/themes/
    - assets/icons/
    - assets/fonts/
    - assets/images/voice_avatars/
    - lib/core/mock/
    # - lib/core/mock/Cambridge_IELTS_18/
    # - lib/core/mock/Cambridge_IELTS_18/audio/
    # - lib/core/mock/Cambridge_IELTS_18/passage/
    # - lib/core/mock/Cambridge_IELTS_18/image/
    - lib/core/mock/Temp/
    - lib/core/mock/Temp/audio/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/poppins/Poppins-Italic.ttf
          style: italic

    - family: FiraCode
      fonts:
        - asset: assets/fonts/firacode/FiraCode-Regular.ttf
          weight: 400
        - asset: assets/fonts/firacode/FiraCode-Bold.ttf
          weight: 700
        - asset: assets/fonts/firacode/FiraCode-Light.ttf
          weight: 300
        - asset: assets/fonts/firacode/FiraCode-Medium.ttf
          weight: 500
        - asset: assets/fonts/firacode/FiraCode-SemiBold.ttf
          weight: 600

    - family: Betm
      fonts:
        - asset: assets/fonts/betm/BetmThin.otf
          weight: 100
        - asset: assets/fonts/betm/BetmExtraLight.otf
          weight: 200
        - asset: assets/fonts/betm/BetmSemiLight.otf
          weight: 300
        - asset: assets/fonts/betm/BetmLight.otf
          weight: 400
        - asset: assets/fonts/betm/BetmMedium.otf
          weight: 500
        - asset: assets/fonts/betm/BetmSemiBold.otf
          weight: 600
        - asset: assets/fonts/betm/BetmBold.otf
          weight: 700
        - asset: assets/fonts/betm/BetmBlack.otf
          weight: 800
        - asset: assets/fonts/betm/BetmExtraBlack.otf
          weight: 900
